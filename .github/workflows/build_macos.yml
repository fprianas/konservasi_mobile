name: Build macOS Desktop Application

on:
  workflow_dispatch: # Tombol manual "Run workflow" di tab Actions
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'macos/**'
      - 'pubspec.yaml'
      - '.github/workflows/build_macos.yml'
  release:
    types: [published]

jobs:
  build-macos:
    name: Build macOS App & DMG Installer
    runs-on: macos-latest # Mesin Mac resmi milik GitHub (Apple Silicon M1/M2)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create Visual DMG Installer (.dmg)
        run: |
          mkdir -p dmg_staging
          cp -R "build/macos/Build/Products/Release/minerba_mobile.app" "dmg_staging/Konservasi Minerba.app"
          if [ -d "macos/installer" ]; then
            cp "macos/installer/BACA_CARA_INSTALL_MAC.txt" "dmg_staging/"
            cp "macos/installer/Izinkan_Aplikasi_Mac.command" "dmg_staging/"
            chmod +x "dmg_staging/Izinkan_Aplikasi_Mac.command"
          fi
          create-dmg \
            --volname "Konservasi Minerba Installer" \
            --window-pos 200 120 \
            --window-size 640 420 \
            --icon-size 96 \
            --icon "Konservasi Minerba.app" 170 160 \
            --hide-extension "Konservasi Minerba.app" \
            --app-drop-link 470 160 \
            --icon "Izinkan_Aplikasi_Mac.command" 210 310 \
            --icon "BACA_CARA_INSTALL_MAC.txt" 430 310 \
            --no-internet-enable \
            "build/macos/Build/Products/Release/Konservasi_Minerba.dmg" \
            "dmg_staging/"

      - name: Compress macOS Application (.app to .zip backup)
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y "minerba_mobile_macos.zip" "minerba_mobile.app"

      - name: Upload macOS DMG & ZIP Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minerba-mobile-macos
          path: |
            build/macos/Build/Products/Release/Konservasi_Minerba.dmg
            build/macos/Build/Products/Release/minerba_mobile_macos.zip
          retention-days: 14

      - name: Attach to GitHub Release (Jika event release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/macos/Build/Products/Release/Konservasi_Minerba.dmg
            build/macos/Build/Products/Release/minerba_mobile_macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
