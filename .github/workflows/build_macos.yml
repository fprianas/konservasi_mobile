name: Build macOS Desktop Application

on:
  workflow_dispatch: # Tombol manual "Run workflow" di tab Actions
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'macos/**'
      - 'pubspec.yaml'
      - '.github/workflows/build_macos.yml'
  release:
    types: [published]

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-latest # Mesin Mac resmi milik GitHub (Apple Silicon M1/M2)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Compress macOS Application (.app to .zip)
        run: |
          cd build/macos/Build/Products/Release
          # Opsi -y wajib digunakan agar symlink framework macOS tidak rusak
          zip -r -y "minerba_mobile_macos.zip" "minerba_mobile.app"

      - name: Upload macOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minerba-mobile-macos
          path: build/macos/Build/Products/Release/minerba_mobile_macos.zip
          retention-days: 14

      - name: Attach to GitHub Release (Jika event release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/macos/Build/Products/Release/minerba_mobile_macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
